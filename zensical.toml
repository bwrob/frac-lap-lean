        { "Core" = [{ "2. Core Pointwise Fractional Laplacian Operators" = "knowledge/Core/Pointwise.md" }, { "3. Core Semigroup and Dirichlet Form Interfaces" = "knowledge/Core/Semigroups.md" }, { "4. Strongly Continuous Contraction Semigroups and Generators" = "knowledge/Core/C0Semigroup.md" }, { "5. Contractive Resolvents and Strong Operator Limits" = "knowledge/Core/ContractiveResolvent.md" }, { "6. Yosida Approximations and Semigroup Generation" = "knowledge/Core/HilleYosidaGeneration.md" }, { "7. The Hille--Yosida Correspondence" = "knowledge/Core/HilleYosidaCorrespondence.md" }, { "8. L^p Zero-Extension Isometry and Smooth Cutoffs" = "knowledge/Core/LpExtension.md" }, { "9. Plancherel's Theorem, Fractional Sobolev Spaces, and Lax--Milgram" = "knowledge/Core/FourierSobolev.md" }, { "56. Analytic Semigroups and Symmetric Parabolic Smoothing" = "knowledge/Core/AnalyticSemigroup.md" }] },
        { "WholeLine" = [{ "10. Whole-Line Anomalous Diffusion Semigroup" = "knowledge/WholeLine/AnomalousDiffusion.md" }, { "11. Classical Cauchy (alpha = 1) and Gaussian (alpha = 2) Heat Kernels" = "knowledge/WholeLine/ClassicalKernels.md" }, { "12. Concrete L^2(mathbb{R}) Fourier Multiplier Semigroup and Resolvent" = "knowledge/WholeLine/FourierSemigroup.md" }, { "13. Translation and the Fourier Transform on L^2(mathbb{R})" = "knowledge/WholeLine/TranslationFourier.md" }, { "14. Fourier Side of the Gagliardo Energy and Density of Schwartz Functions" = "knowledge/WholeLine/GagliardoFourier.md" }, { "15. Density of Schwartz Functions in the Gagliardo Space" = "knowledge/WholeLine/GagliardoDensity.md" }, { "18. The Symmetric Stable Heat Kernel" = "knowledge/WholeLine/StableKernel.md" }, { "19. Tail Estimates for the Stable Kernel" = "knowledge/WholeLine/StableKernelTail.md" }, { "20. Gaussian Mixtures and Monotone Regularized Transforms" = "knowledge/WholeLine/StableSubordination.md" }, { "21. The Stable Subordinator and its Lévy Measure" = "knowledge/WholeLine/StableLevy.md" }, { "22. Positivity and Monotonicity of the Stable Kernel" = "knowledge/WholeLine/StableKernelPositivity.md" }, { "23. Algebraic Tail Decay of the Stable Kernel" = "knowledge/WholeLine/StableKernelDecay.md" }, { "24. Symmetric Alpha-Stable Heat Kernel" = "knowledge/WholeLine/StableHeatKernel.md" }, { "25. The Stable Kernel Realizes the Fractional Heat Semigroup" = "knowledge/WholeLine/StableSemigroup.md" }, { "31. Homogeneity of the Fourier-Side Gagliardo Weight" = "knowledge/WholeLine/GagliardoScaling.md" }, { "34. The Exact Fourier Symbol of the Gagliardo Energy" = "knowledge/WholeLine/GagliardoSymbolExact.md" }, { "43. Energy Dissipation for the Fractional Heat Semigroup" = "knowledge/WholeLine/SemigroupDissipation.md" }, { "44. Nash Inequality and L^1 to L^2 Decay of the Fractional Heat Semigroup" = "knowledge/WholeLine/NashUltracontractivity.md" }, { "49. Stein's Maximal Inequality for the Fractional Heat Semigroup" = "knowledge/WholeLine/SteinMaximal.md" }, { "50. Singular Integral and Fourier Multiplier Agree on Schwartz Functions" = "knowledge/WholeLine/PointwiseEquivalence.md" }, { "51. Bochner Heat Subordination of the Fractional Laplacian" = "knowledge/WholeLine/HeatSubordination.md" }, { "52. Multipliers and a Smooth Cutoff for the Gagliardo Energy" = "knowledge/WholeLine/GagliardoMultiplier.md" }, { "55. Sobolev Equivalence, Self-Adjointness, and Dirichlet Form Packaging" = "knowledge/WholeLine/SobolevEquivalence.md" }, { "57. Analyticity of the Fractional Heat Semigroup" = "knowledge/WholeLine/FractionalAnalytic.md" }] },
