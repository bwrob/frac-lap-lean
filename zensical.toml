[project]
    edit_uri         = "edit/main/docs/"
    repo_name        = "bwrob/frac-lap-lean"
    repo_url         = "https://github.com/bwrob/frac-lap-lean"
    site_author      = "Bartosz Wróblewski"
    site_description = "A Lean 4 formalization and human-readable blueprint of the fractional Laplacian."
    site_name        = "FracLap"
    site_url         = "https://bwrob.github.io/frac-lap-lean/"

    nav = [
