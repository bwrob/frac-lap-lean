[project]
name = "frac-lap-lean"
version = "0.1.0"
description = "Lean 4 + Mathlib formalization of the fractional Laplacian with a 1-to-1 leanblueprint"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "typer>=0.15.0",
]

[dependency-groups]
dev = [
    "complexipy>=8.0.0",
    "prek>=0.5.5",
    "pyrefly>=1.2.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]
docs = [
    "loguru>=0.7.0",
    "typer>=0.29.2",
    "zensical>=0.0.70",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "SIM", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
preset = "strict"
project-includes = [
    "scripts/**/*.py",
    "tests/**/*.py",
    ".agents/skills/**/scripts/*.py",
]
search-path = ["scripts"]

[tool.complexipy]
paths = ["scripts", "tests", ".agents/skills"]
max-complexity-allowed = 15

[tool.pytest.ini_options]
pythonpath = ["scripts"]
