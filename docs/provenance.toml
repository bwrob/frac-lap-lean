# Provenance manifest: where each blueprint chapter (= Lean module) comes from.
#
# Every chapter gets exactly one ORIGIN. The documentation generator (scripts/gen_docs.py) turns this
# into badges and navigation, and `--check` fails if a chapter is unclassified or a name is unknown.
# The assignment is a maintainer decision, not something inferred from the code.

[origins.thesis]
    label   = "Original work"
    short   = "thesis"
    meaning = "Results of the author's master's thesis and their direct formalization (Section 5 and Appendix A), together with the modules they rest on."

[origins.corpus]
    label   = "Common knowledge"
    short   = "corpus"
    meaning = "Published, standard results formalized from the literature (semigroup theory, classical inequalities, textbook facts). Sources are cited in the module docstrings and the bibliography."

[modules."Basic"]
    origin = "thesis"

